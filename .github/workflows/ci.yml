name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Alert rules and unit tests
        run: make check

      - name: Grafana dashboard is valid JSON
        run: jq empty grafana/dashboards/*.json

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          make init
          docker compose up -d --wait --wait-timeout 120

      - name: Check every component
        run: |
          set -eux
          curl -fsS http://localhost:9090/-/ready
          curl -fsS http://localhost:9093/-/ready
          curl -fsS http://localhost:3000/api/health
          # Prometheus loaded all 8 alert rules
          test "$(curl -fsS http://localhost:9090/api/v1/rules | jq '[.data.groups[].rules[]] | length')" -eq 8
          # Grafana provisioned the dashboard
          curl -fsS -u admin:change-me http://localhost:3000/api/dashboards/uid/monitoring-overview | jq -e '.dashboard.title == "Overview"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
