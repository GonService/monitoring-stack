# Alerts go to Telegram. Put the bot token in secrets/telegram_bot_token and the chat ID
# in .env (TELEGRAM_CHAT_ID). For Slack or e-mail, see README.
route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: telegram
      repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager-secrets/telegram_bot_token
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: HTML
        send_resolved: true

inhibit_rules:
  # A site that is down will also be slow: keep only the critical alert.
  - source_matchers: [alertname="SiteDown"]
    target_matchers: [alertname="SiteSlow"]
    equal: [instance]
