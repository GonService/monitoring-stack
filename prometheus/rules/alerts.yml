groups:
  - name: availability
    rules:
      - alert: SiteDown
        expr: probe_success{job="http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "HTTP check has been failing for more than 2 minutes."

      - alert: SiteSlow
        expr: avg_over_time(probe_duration_seconds{job="http"}[5m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is slow"
          description: "Average response time is {{ $value | humanizeDuration }} over 5 minutes."

      - alert: TLSCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="http"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate of {{ $labels.instance }} expires in {{ $value | humanize }} days"
          description: "Renew the certificate before it expires."

      - alert: TargetDown
        expr: up{job!="http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is not responding"
          description: "Prometheus cannot scrape this target."

  - name: servers
    rules:
      - alert: HighCPU
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% for 10 minutes."

      - alert: HighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory above 90% on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanize }}%."

      - alert: DiskAlmostFull
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% disk free on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Only {{ $value | humanize }}% left."

      - alert: DiskWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24 hours"
          description: "Based on the trend of the last 6 hours."
